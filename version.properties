# Единый источник версии для модулей :phone и :watch.
# Формат versionName: <версия>-<чекпоинт>.<номер фикса>, например 0.9.0-05A22.1
# Номер фикса растёт на 1 при каждом фиксе внутри одного чекпоинта, сбрасывается на 1 при переходе на новый чекпоинт.
versionName=0.9.0-05A25.11
# versionCode растёт на 1 при каждой сборке, которая реально ставится на устройства (adb install).
versionCode=104
